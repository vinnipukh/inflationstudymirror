name: Yapimaks Scraper Daily Run

on:
  schedule:
    # Her gün gece yarısı 02:00'da çalışır (UTC saati ile)
    - cron: '0 2 * * *'
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Public repo'da GitHub job'lari EN FAZLA 6 saat (360 dk) çalışır;
    # timeout-minutes bunun üstüne çıkamaz. Scraper artık async + günlük
    # yenileme bütçesi (--refresh-budget 2500) + koşu bütçesi (--max-duration 240)
    # ile çalışır; catch-up bile ~1-1.5 saatte biter, asla 6 saate takılmaz.
    timeout-minutes: 360


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run Scraper
        # Belirttiğin tam dizindeki scripti çalıştırır
        run: python InflationItems/Codes/ConstructionMarkets/yapimaks/scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Datas klasörünün altındaki tüm değişiklikleri ve logları kaydeder
          git add InflationItems/Datas/ logs/
          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı, commit atlandı."
            exit 0
          fi
          git commit -m "Auto-update: Tüm Datas ve log değişiklikleri eklendi [skip ci]"
          # Aynı anda birden fazla günlük workflow main'e push edebildiği için
          # non-fast-forward reddinde rebase + retry yap.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "PUSH OK"
              exit 0
            fi
            echo "Push rejected (concurrent güncelleme); rebase + retry ($i/5)..."
            sleep 15
            git pull --rebase origin main || echo "Rebase çakışması; push tekrar deneniyor."
          done
          echo "Push 5 denemede de başarısız oldu."
          exit 1
