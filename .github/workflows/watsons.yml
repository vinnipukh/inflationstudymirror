name: Watsons Scraper Daily Run

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PINNED: curl_cffi 0.16.0 (2026-08-01) dropped the py3.10 runtime
          # fallback for `typing.Unpack` (only in Python >=3.11) and does NOT
          # declare typing_extensions as a base dependency -> instant crash:
          #   ModuleNotFoundError: No module named 'typing_extensions'
          # 0.15.0 is the last version that runs on the CI Python 3.10 without it.
          pip install "curl_cffi==0.15.0"

      - name: Run Scraper
        run: python Codes/Cosmetics/Watson/scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Datas/ logs/
          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı, commit atlandı."
            exit 0
          fi
          git commit -m "Auto-update: Watsons ürün verileri eklendi [skip ci]"
          # Diğer planlı workflow'lar (Beymen, Chakra, Vakko, Gurmar...) aynı anda
          # main'e push edebilir. Non-fast-forward reddi yaşanırsa rebase + retry.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "PUSH OK"
              exit 0
            fi
            echo "Push rejected (concurrent güncelleme); rebase + retry ($i/5)..."
            sleep 15
            git pull --rebase origin main || echo "Rebase çakışması; push tekrar deneniyor."
          done
          echo "Push 5 denemede de başarısız oldu."
          exit 1