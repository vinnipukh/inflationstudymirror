name: Emlakjet Residential Rental Scraper

on:
  schedule:
    # 16:00 UTC = 19:00 Türkiye time (UTC+3)
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emlakjet-residential-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 selenium
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Run Emlakjet scraper
        run: |
          # --resume continues an interrupted crawl through the tracked
          # checkpoint under InflationItems/Datas/HousesRent/Emlakjet/state/; the scraper
          # also restarts Chrome itself when the session stalls.
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            python -m InflationItems.Codes.HousesRent.Emlakjet.scraper --resume

      - name: Commit and push Emlakjet data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add InflationItems/Datas/HousesRent/Emlakjet/
          if git diff --staged --quiet; then
            echo "No new Emlakjet data to commit."
          else
            git commit -m "chore(data): Emlakjet rental scrape $(date -u +'%Y-%m-%d')"
            git push
          fi
