version = "0.2.0"
description = "Price-data scrapers and inflation calculation pipeline for the Inflation Study project"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "camoufox>=0.4",
    "cloudscraper>=1.2",
    "curl-cffi>=0.7",
    "DrissionPage>=4.1",
    "httpx>=0.27",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "regex>=2024.0",
    "requests>=2.32",
    "seaborn>=0.13",
    "selenium>=4.20",
    "seleniumbase>=4.20",
    "tqdm>=4.66",
    "undetected-chromedriver>=3.5",
]
